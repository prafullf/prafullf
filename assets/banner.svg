<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#2459cc"/>
      <stop offset="0.38" stop-color="#1a45a6"/>
      <stop offset="0.72" stop-color="#0a1f62"/>
      <stop offset="1" stop-color="#020a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.56" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#9cc3ff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#5b8ff0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1a45a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#cfe1ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7dcff"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff"/>
    </pattern>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotMask"><rect width="1280" height="360" fill="url(#fadeR)"/></mask>
    <filter id="blur20" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <path id="arcPath" d="M 470 380 C 700 300, 900 160, 1150 -20"/>
    <path id="e1" d="M 990 120 L 1090 80"/>
    <path id="e2" d="M 1090 80 L 1180 150"/>
    <path id="e3" d="M 990 120 L 1060 220"/>
    <path id="e4" d="M 1060 220 L 1180 150"/>
    <path id="e5" d="M 1060 220 L 1150 280"/>
    <path id="e6" d="M 1180 150 L 1230 240"/>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .breathe { animation: breathe 6s ease-in-out infinite; transform-origin: 717px 180px; }
      @keyframes breathe { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
      .live { animation: live 1.6s ease-in-out infinite; }
      @keyframes live { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
      .node { animation: node 3s ease-in-out infinite; }
      @keyframes node { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect class="breathe" width="1280" height="360" fill="url(#glow)"/>
  <rect width="1280" height="360" fill="url(#dots)" opacity="0.07" mask="url(#dotMask)"/>

  <!-- light arc (like the LinkedIn banner) -->
  <use href="#arcPath" fill="none" stroke="#b9d3ff" stroke-width="46" opacity="0.22" filter="url(#blur20)"/>
  <use href="#arcPath" fill="none" stroke="url(#arc)" stroke-width="2.5"/>
  <circle r="7" fill="#ffffff" filter="url(#blur6)">
    <animateMotion dur="5s" repeatCount="indefinite" rotate="auto"><mpath href="#arcPath"/></animateMotion>
  </circle>
  <circle r="2.5" fill="#ffffff">
    <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#arcPath"/></animateMotion>
  </circle>

  <!-- distributed-system node graph -->
  <g stroke="#9cc3ff" stroke-opacity="0.28" stroke-width="1.4" fill="none">
    <use href="#e1"/><use href="#e2"/><use href="#e3"/><use href="#e4"/><use href="#e5"/><use href="#e6"/>
  </g>
  <g fill="#7fb0ff">
    <circle r="3" filter="url(#soft)"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
    <circle r="3" filter="url(#soft)"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
    <circle r="3" filter="url(#soft)"><animateMotion dur="2.8s" begin="0.4s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
    <circle r="3" filter="url(#soft)"><animateMotion dur="2.2s" begin="1.2s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
    <circle r="3" filter="url(#soft)"><animateMotion dur="2.6s" begin="0.2s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
    <circle r="3" filter="url(#soft)"><animateMotion dur="2s" begin="1s" repeatCount="indefinite"><mpath href="#e6"/></animateMotion></circle>
  </g>
  <g>
    <circle class="node" cx="990" cy="120" r="7" fill="#1e3a8a" stroke="#9cc3ff" stroke-width="2"/>
    <circle class="node" cx="1090" cy="80" r="9" fill="#1e3a8a" stroke="#cfe1ff" stroke-width="2" style="animation-delay:.5s"/>
    <circle class="node" cx="1180" cy="150" r="11" fill="#1e40af" stroke="#ffffff" stroke-width="2" style="animation-delay:1s"/>
    <circle class="node" cx="1060" cy="220" r="8" fill="#1e3a8a" stroke="#9cc3ff" stroke-width="2" style="animation-delay:1.5s"/>
    <circle class="node" cx="1150" cy="280" r="6" fill="#1e3a8a" stroke="#9cc3ff" stroke-width="2" style="animation-delay:2s"/>
    <circle class="node" cx="1230" cy="240" r="6" fill="#1e3a8a" stroke="#9cc3ff" stroke-width="2" style="animation-delay:2.5s"/>
  </g>

  <!-- text -->
  <g class="up1">
    <text x="80" y="96" class="mono" font-size="17" fill="#a9c8ff">~/prafullf<tspan fill="#ffffff"> $ </tspan>whoami<tspan class="cursor" fill="#ffffff"> ▍</tspan></text>
  </g>
  <g class="up2">
    <text x="76" y="168" class="sans" font-size="68" font-weight="800" letter-spacing="-1" fill="url(#name)">Prafull Narang</text>
  </g>
  <g class="up3">
    <text x="80" y="214" class="sans" font-size="24" font-weight="500" fill="#dbe8ff">Backend <tspan fill="#7fb0ff">·</tspan> GenAI / RAG <tspan fill="#7fb0ff">·</tspan> High-performance C++</text>
  </g>
  <g class="up4 sans" font-size="15" font-weight="600">
    <rect x="80" y="244" width="214" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.28"/>
    <text x="187" y="266" text-anchor="middle" fill="#ffffff">MCA · NIT Warangal ’27</text>

    <rect x="306" y="244" width="216" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.28"/>
    <text x="414" y="266" text-anchor="middle" fill="#ffffff">Research Intern @ NITW</text>

    <rect x="534" y="244" width="224" height="34" rx="17" fill="#22c55e" fill-opacity="0.16" stroke="#4ade80" stroke-opacity="0.6"/>
    <circle class="live" cx="554" cy="261" r="5" fill="#4ade80"/>
    <text x="656" y="266" text-anchor="middle" fill="#dcfce7">Open to SDE &amp; ML roles</text>
  </g>
  <text x="1200" y="336" text-anchor="end" class="mono" font-size="13" fill="#9cc3ff" fill-opacity="0.7">fast · tested · deployed</text>
</svg>
