<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a96"/>
      <stop offset="1" stop-color="#06123d"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9cc3ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c1"><rect x="16" y="14" width="270" height="172" rx="18"/></clipPath>
    <clipPath id="c2"><rect x="314" y="14" width="270" height="172" rx="18"/></clipPath>
    <clipPath id="c3"><rect x="612" y="14" width="270" height="172" rx="18"/></clipPath>
    <clipPath id="c4"><rect x="910" y="14" width="270" height="172" rx="18"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
      .sh { animation: sweep 5s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-320px); } 60%,100% { transform: translateX(340px); } }
    </style>
  </defs>

  <g class="a1">
    <rect x="16" y="14" width="270" height="172" rx="18" fill="url(#card)" stroke="#60a5fa" stroke-opacity="0.45"/>
    <rect x="46" y="14" width="210" height="2" fill="url(#accent)"/>
    <g clip-path="url(#c1)"><rect class="sh" x="16" y="14" width="140" height="172" fill="url(#shine)"/></g>
    <text x="40" y="52" class="mono" font-size="12" letter-spacing="2" fill="#7fb0ff">THROUGHPUT</text>
    <text x="38" y="112" class="sans" font-size="50" font-weight="800" fill="url(#num)">2.7M<tspan font-size="24" font-weight="700">/s</tspan></text>
    <text x="40" y="146" class="sans" font-size="15" fill="#c7dcff">samples, zero loss</text>
    <text x="40" y="168" class="sans" font-size="13" fill="#7fa3e0">C++17 telemetry agent</text>
  </g>

  <g class="a2">
    <rect x="314" y="14" width="270" height="172" rx="18" fill="url(#card)" stroke="#60a5fa" stroke-opacity="0.45"/>
    <rect x="344" y="14" width="210" height="2" fill="url(#accent)"/>
    <g clip-path="url(#c2)"><rect class="sh" x="314" y="14" width="140" height="172" fill="url(#shine)" style="animation-delay:.6s"/></g>
    <text x="338" y="52" class="mono" font-size="12" letter-spacing="2" fill="#7fb0ff">ACCURACY</text>
    <text x="336" y="112" class="sans" font-size="50" font-weight="800" fill="url(#num)">99.8<tspan font-size="30" font-weight="700">%</tspan></text>
    <text x="338" y="146" class="sans" font-size="15" fill="#c7dcff">attacks blocked in 1.6 s</text>
    <text x="338" y="168" class="sans" font-size="13" fill="#7fa3e0">ML DDoS filter · IoT + SDN</text>
  </g>

  <g class="a3">
    <rect x="612" y="14" width="270" height="172" rx="18" fill="url(#card)" stroke="#60a5fa" stroke-opacity="0.45"/>
    <rect x="642" y="14" width="210" height="2" fill="url(#accent)"/>
    <g clip-path="url(#c3)"><rect class="sh" x="612" y="14" width="140" height="172" fill="url(#shine)" style="animation-delay:1.2s"/></g>
    <text x="636" y="52" class="mono" font-size="12" letter-spacing="2" fill="#7fb0ff">LATENCY · P95</text>
    <text x="634" y="112" class="sans" font-size="50" font-weight="800" fill="url(#num)">240<tspan font-size="26" font-weight="700">ms</tspan></text>
    <text x="636" y="146" class="sans" font-size="15" fill="#c7dcff">sandboxed run at 200/min</text>
    <text x="636" y="168" class="sans" font-size="13" fill="#7fa3e0">CodeSync · Docker workers</text>
  </g>

  <g class="a4">
    <rect x="910" y="14" width="270" height="172" rx="18" fill="url(#card)" stroke="#60a5fa" stroke-opacity="0.45"/>
    <rect x="940" y="14" width="210" height="2" fill="url(#accent)"/>
    <g clip-path="url(#c4)"><rect class="sh" x="910" y="14" width="140" height="172" fill="url(#shine)" style="animation-delay:1.8s"/></g>
    <text x="934" y="52" class="mono" font-size="12" letter-spacing="2" fill="#7fb0ff">RESEARCH</text>
    <text x="932" y="112" class="sans" font-size="50" font-weight="800" fill="url(#num)">670K<tspan font-size="30" font-weight="700">+</tspan></text>
    <text x="934" y="146" class="sans" font-size="15" fill="#c7dcff">real COVID-19 cases modelled</text>
    <text x="934" y="168" class="sans" font-size="13" fill="#7fa3e0">Intern · NIT Warangal</text>
  </g>
</svg>
